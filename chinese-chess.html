<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>楚河汉界 · 中国象棋</title><style>*{box-sizing:border-box}body{margin:0;background:#232d29;color:#f9edcf;font-family:'Microsoft YaHei',sans-serif;display:flex;justify-content:center;padding:28px;gap:35px;flex-wrap:wrap}h1{font-size:30px}aside{width:260px}button{padding:12px 24px;border:0;border-radius:8px;background:#e5bb74;color:#312719;margin:6px;cursor:pointer;font:inherit}canvas{max-width:100%;height:auto;border-radius:12px;box-shadow:0 15px 50px #0006;touch-action:manipulation}p{line-height:1.9;color:#d3d9d0}#status{font-size:22px;color:#ffd688}</style><canvas id="board" width="540" height="600"></canvas><aside><h1>楚河 · 汉界</h1><p>中国象棋 / 本地双人对弈</p><h2 id="status"></h2><button onclick="undo()">悔棋</button><button onclick="reset()">重新开始</button><p>红方先行。点击棋子，再点击目标位置。亮点表示合法落点。</p><p>支持马腿、象眼、炮架、九宫、过河兵、将帅照面及将军检查。</p></aside><script>
const c=document.querySelector('canvas'),g=c.getContext('2d'),s=document.querySelector('#status');let b,turn,sel,history,over;const names={r:{R:'俥',N:'傌',B:'相',A:'仕',K:'帅',C:'炮',P:'兵'},b:{R:'車',N:'馬',B:'象',A:'士',K:'将',C:'砲',P:'卒'}};
function reset(){b=Array.from({length:10},()=>Array(9).fill(null));['R','N','B','A','K','A','B','N','R'].forEach((t,x)=>{b[0][x]='b'+t;b[9][x]='r'+t});for(let x of [1,7]){b[2][x]='bC';b[7][x]='rC'}for(let x of [0,2,4,6,8]){b[3][x]='bP';b[6][x]='rP'}turn='r';sel=null;history=[];over=false;draw()}
function raw(a,x,y,X,Y){let p=a[y][x];if(!p||x===X&&y===Y||a[Y][X]?.[0]===p[0])return false;let dx=X-x,dy=Y-y,ax=Math.abs(dx),ay=Math.abs(dy),red=p[0]==='r',t=p[1],n=0;if(x===X||y===Y){let sx=Math.sign(dx),sy=Math.sign(dy);for(let i=x+sx,j=y+sy;i!==X||j!==Y;i+=sx,j+=sy)if(a[j][i])n++}if(t==='K'&&x===X&&a[Y][X]?.[1]==='K'&&n===0)return true;switch(t){case'R':return(x===X||y===Y)&&n===0;case'C':return(x===X||y===Y)&&n===(a[Y][X]?1:0);case'N':return ax*ay===2&&!a[y+(ay===2?Math.sign(dy):0)][x+(ax===2?Math.sign(dx):0)];case'B':return ax===2&&ay===2&&(red?Y>=5:Y<=4)&&!a[y+dy/2][x+dx/2];case'A':return ax===1&&ay===1&&X>=3&&X<=5&&(red?Y>=7:Y<=2);case'K':return ax+ay===1&&X>=3&&X<=5&&(red?Y>=7:Y<=2);case'P':return dx===0&&dy===(red?-1:1)||((red?y<=4:y>=5)&&ay===0&&ax===1)}return false}
function check(a,color){let king;for(let y=0;y<10;y++)for(let x=0;x<9;x++)if(a[y][x]===color+'K')king=[x,y];if(!king)return true;for(let y=0;y<10;y++)for(let x=0;x<9;x++)if(a[y][x]&&a[y][x][0]!==color&&raw(a,x,y,...king))return true;return false}
function legal(x,y,X,Y){if(!raw(b,x,y,X,Y))return false;let a=b.map(r=>r.slice()),color=a[y][x][0];a[Y][X]=a[y][x];a[y][x]=null;return!check(a,color)}
function moves(){for(let y=0;y<10;y++)for(let x=0;x<9;x++)if(b[y][x]?.[0]===turn)for(let Y=0;Y<10;Y++)for(let X=0;X<9;X++)if(legal(x,y,X,Y))return true;return false}
function draw(){g.fillStyle='#e8c58f';g.fillRect(0,0,540,600);g.strokeStyle='#795735';g.lineWidth=1.4;for(let y=0;y<10;y++){g.beginPath();g.moveTo(38,38+y*58);g.lineTo(502,38+y*58);g.stroke()}for(let x=0;x<9;x++){for(let [a,z]of[[0,4],[5,9]]){g.beginPath();g.moveTo(38+x*58,38+a*58);g.lineTo(38+x*58,38+z*58);g.stroke()}}for(let y of[0,7]){g.beginPath();g.moveTo(212,38+y*58);g.lineTo(328,38+(y+2)*58);g.moveTo(328,38+y*58);g.lineTo(212,38+(y+2)*58);g.stroke()}g.fillStyle='#795735';g.font='26px Microsoft YaHei';g.textAlign='center';g.textBaseline='middle';g.fillText('楚 河',155,299);g.fillText('汉 界',385,299);for(let y=0;y<10;y++)for(let x=0;x<9;x++){let p=b[y][x];if(p){g.beginPath();g.arc(38+x*58,38+y*58,24,0,7);g.fillStyle='#fff0ce';g.fill();g.strokeStyle=sel&&sel[0]===x&&sel[1]===y?'#2b9a75':'#996e3f';g.lineWidth=sel&&sel[0]===x&&sel[1]===y?4:2;g.stroke();g.fillStyle=p[0]==='r'?'#ba3527':'#253b33';g.font='bold 29px Microsoft YaHei';g.fillText(names[p[0]][p[1]],38+x*58,39+y*58)}if(sel&&legal(...sel,x,y)){g.beginPath();g.arc(38+x*58,38+y*58,7,0,7);g.fillStyle='#237a68bb';g.fill()}}s.textContent=over? (turn==='r'?'黑方':'红方')+'获胜！':(turn==='r'?'红方':'黑方')+'走棋'+(check(b,turn)?' · 将军！':'')}
c.onclick=e=>{if(over)return;let r=c.getBoundingClientRect(),x=Math.round(((e.clientX-r.left)*540/r.width-38)/58),y=Math.round(((e.clientY-r.top)*600/r.height-38)/58);if(x<0||x>8||y<0||y>9)return;if(b[y][x]?.[0]===turn){sel=[x,y];draw();return}if(sel&&legal(...sel,x,y)){history.push({b:b.map(r=>r.slice()),turn});b[y][x]=b[sel[1]][sel[0]];b[sel[1]][sel[0]]=null;turn=turn==='r'?'b':'r';sel=null;over=!moves();draw()}};function undo(){let h=history.pop();if(h){b=h.b;turn=h.turn;over=false;sel=null;draw()}}reset();
</script></html>
